# Giữ dự án Supabase (gói miễn phí) không bị tạm dừng khi nghỉ hè / nghỉ Tết.
# Mỗi ngày 1 lần GitHub gọi trang /api/song của web → web truy vấn database 1 lần.
# CÀI MỘT LẦN: GitHub → kho này → Settings → Secrets and variables → Actions → tab "Variables"
#   → New repository variable: Name = SITE_URL, Value = https://<tên-web>.vercel.app
# Lưu ý: GitHub tự tắt lịch chạy nếu kho không có commit nào trong 60 ngày — vào tab Actions bấm "Enable" lại.
name: Giu web thuc
on:
  schedule:
    - cron: "17 1 * * *"   # 08:17 sáng giờ Việt Nam mỗi ngày
  workflow_dispatch: {}      # cho phép bấm chạy thử bằng tay (tab Actions → Run workflow)
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Goi /api/song
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "Chua dat bien SITE_URL (xem huong dan o dau file)"; exit 1; fi
          curl -fsS --retry 3 --retry-delay 20 "$SITE_URL/api/song"
