<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif"><title>Học sinh – Đổi mật khẩu lần đầu</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8F1FF"/><stop offset="1" stop-color="#F7FAFF"/></linearGradient>
<linearGradient id="sb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2A5E"/><stop offset="1" stop-color="#14224F"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.08"/></filter>
</defs><rect width="1400" height="780" fill="url(#bg)"/><rect x="250" y="90" width="900" height="600" rx="20" fill="#ffffff" stroke="#E3ECFA" filter="url(#sh)"/><rect x="250" y="90" width="420" height="600" rx="20" fill="#EEF4FF" stroke="none" /><rect x="330" y="210" width="260" height="260" rx="30" fill="#fff" stroke="#93C5FD" stroke-dasharray="6 5"/><text x="460" y="335" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle" >robot-shield.png</text><text x="460" y="358" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" >(hình minh họa)</text><text x="460" y="530" font-size="18" font-weight="700" fill="#0F1B4C" text-anchor="middle" >Chào mừng em đến lớp Python!</text><text x="710" y="170" font-size="30" font-weight="800" fill="#0F1B4C" text-anchor="start" >Đặt mật khẩu mới</text><text x="710" y="202" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" >Đây là lần đầu em đăng nhập. Hãy tự đặt mật khẩu riêng</text><text x="710" y="222" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" >và ghi nhớ thật kỹ nhé (em chỉ tự đổi được lần này).</text><text x="710" y="260" font-size="15" font-weight="600" fill="#334155" text-anchor="start" >Mật khẩu mới</text><rect x="710" y="272" width="400" height="50" rx="14" fill="#F8FAFF" stroke="#CBD5E1" /><text x="730" y="304" font-size="18" font-weight="600" fill="#334155" text-anchor="start" >••••••••</text><text x="1085" y="303" font-size="16" font-weight="400" fill="#64748B" text-anchor="end" >👁</text><text x="710" y="360" font-size="15" font-weight="600" fill="#334155" text-anchor="start" >Nhập lại mật khẩu mới</text><rect x="710" y="372" width="400" height="50" rx="14" fill="#F8FAFF" stroke="#CBD5E1" /><text x="730" y="404" font-size="18" font-weight="600" fill="#334155" text-anchor="start" >••••••••</text><text x="1085" y="403" font-size="16" font-weight="400" fill="#64748B" text-anchor="end" >👁</text><text x="710" y="485" font-size="14" font-weight="600" fill="#16A34A" text-anchor="start" >✓ Ít nhất 6 ký tự   ✓ Có cả chữ và số   ✓ Hai ô giống nhau</text><rect x="710" y="520" width="400" height="52" rx="26.0" fill="#F97316" stroke="none" /><text x="910.0" y="552.12" font-size="17" font-weight="600" fill="#fff" text-anchor="middle" >Xác nhận</text><text x="910" y="610" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle" >Quên mật khẩu sau này? Bấm “Quên mật khẩu”</text><text x="910" y="630" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle" >ở trang đăng nhập để báo thầy.</text></svg>